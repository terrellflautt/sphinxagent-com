<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat - Sphinx Agent</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}</script>
  <style>
    :root {
      --primary: #D4AF37;
      --primary-dark: #B8960F;
      --bg: #ffffff;
      --bg-chat: #f8f9fc;
      --bg-card: #ffffff;
      --text: #1a1a2e;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --bubble-bot: #f3f4f6;
      --bubble-bot-text: #1f2937;
    }
    .dark {
      --bg: #0a0e1a;
      --bg-chat: #111827;
      --bg-card: #141b2d;
      --text: #f1f5f9;
      --text-light: #94a3b8;
      --border: #1e293b;
      --bubble-bot: #1e293b;
      --bubble-bot-text: #e2e8f0;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }

    /* Header */
    .chat-header {
      background: #D4AF37;
      padding: 14px 20px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .chat-header-avatar {
      width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff; font-weight: 700;
    }
    .chat-header-info h1 { color: #fff; font-size: 1rem; font-weight: 600; }
    .chat-header-info p { color: rgba(255,255,255,0.75); font-size: 0.78rem; }
    .chat-header-actions { margin-left: auto; display: flex; gap: 8px; }
    .chat-header-btn {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .chat-header-btn:hover { background: rgba(255,255,255,0.25); }
    .chat-header-btn svg { width: 18px; height: 18px; }

    /* Messages */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px; background: var(--bg-chat);
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg { max-width: 85%; display: flex; flex-direction: column; }
    .msg.bot { align-self: flex-start; }
    .msg.user { align-self: flex-end; }
    .msg .bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 0.9rem;
      line-height: 1.55; word-wrap: break-word; white-space: pre-wrap;
    }
    .msg.bot .bubble {
      background: var(--bubble-bot); color: var(--bubble-bot-text);
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #D4AF37; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg .meta {
      font-size: 0.68rem; color: var(--text-light); margin-top: 3px;
      padding: 0 4px;
    }
    .msg.user .meta { text-align: right; }

    .typing .bubble {
      background: var(--bubble-bot); color: var(--text-light);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }

    /* Input */
    .chat-input-area {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; background: var(--bg-card); flex-shrink: 0;
    }
    .chat-input {
      flex: 1; border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px; font-size: 0.9rem; background: var(--bg-chat);
      color: var(--text); font-family: inherit; outline: none;
      resize: none; min-height: 42px; max-height: 120px;
    }
    .chat-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(212,175,55,0.15); }
    .chat-input::placeholder { color: var(--text-light); }
    .chat-send {
      background: #D4AF37; color: #fff;
      border: none; border-radius: 12px; padding: 10px 18px;
      font-weight: 600; font-size: 0.9rem; cursor: pointer; font-family: inherit;
      transition: opacity 0.2s; align-self: flex-end;
    }
    .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-send:hover:not(:disabled) { opacity: 0.9; }

    /* Footer */
    .chat-footer {
      text-align: center; padding: 8px; font-size: 0.7rem; color: var(--text-light);
      background: var(--bg-card); border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .chat-footer a { color: var(--primary); text-decoration: none; }

    /* Loading state */
    .loading-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; color: var(--text-light);
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 40px; text-align: center;
    }
    .error-state h2 { font-size: 1.2rem; color: var(--text); }
    .error-state p { color: var(--text-light); font-size: 0.9rem; }
    .error-state a {
      background: var(--primary); color: #fff; padding: 10px 24px;
      border-radius: 10px; text-decoration: none; font-weight: 600;
    }

    @media (min-width: 640px) {
      body { padding: 20px; background: var(--bg-chat); }
      .chat-container {
        max-width: 500px; margin: 0 auto; border-radius: 20px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.15); overflow: hidden;
        display: flex; flex-direction: column; height: calc(100vh - 40px);
        border: 1px solid var(--border);
      }
    }
    @media (max-width: 639px) {
      .chat-container { display: flex; flex-direction: column; height: 100vh; }
    }

    /* Voice */
    .voice-btn {
      background: none; border: 1px solid var(--border); color: var(--text-light);
      width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0; align-self: flex-end;
    }
    .voice-btn:hover { border-color: var(--primary); color: var(--primary); }
    .voice-btn.listening {
      background: var(--primary); border-color: var(--primary); color: #fff;
      animation: voice-pulse 1.5s infinite;
    }
    .voice-btn svg { width: 20px; height: 20px; }
    @keyframes voice-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,0.4);} 50%{box-shadow:0 0 0 10px rgba(212,175,55,0);} }

    .voice-indicator {
      display: none; padding: 8px 16px; text-align: center;
      font-size: 0.78rem; color: var(--primary); font-weight: 500;
      background: rgba(212,175,55,0.06); border-top: 1px solid var(--border);
    }
    .voice-indicator.active { display: block; }

    .tts-btn {
      background: none; border: none; color: var(--text-light); cursor: pointer;
      padding: 2px 6px; border-radius: 4px; font-size: 0.7rem;
      transition: color 0.2s; display: inline-flex; align-items: center; gap: 3px;
    }
    .tts-btn:hover { color: var(--primary); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chatContainer">
    <!-- Loading state -->
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <p>Loading agent...</p>
    </div>
  </div>

  <script>
    var API = 'https://dgyr0dzn4k.execute-api.us-east-1.amazonaws.com/production';
    var agentId = new URLSearchParams(window.location.search).get('id');
    var conversationId = null;
    var agentName = 'AI Assistant';
    var agentColor = '#D4AF37';
    var greeting = 'Hello! How can I help you?';

    if (!agentId) {
      showError('No agent specified', 'Add ?id=AGENT_ID to the URL, or get a link from your Sphinx Agent dashboard.');
    } else {
      loadAgent();
    }

    // Try to restore conversation
    try {
      var saved = sessionStorage.getItem('sphinx_chat_' + agentId);
      if (saved) conversationId = JSON.parse(saved).conversationId;
    } catch(e) {}

    async function loadAgent() {
      try {
        // We don't have a public get-agent endpoint, so just show the chat
        // The widget/chat endpoint will validate the agent exists
        renderChat();
      } catch(e) {
        showError('Failed to load agent', e.message);
      }
    }

    function renderChat() {
      var container = document.getElementById('chatContainer');
      container.innerHTML = '' +
        '<div class="chat-header">' +
          '<div class="chat-header-avatar" id="agentAvatar">A</div>' +
          '<div class="chat-header-info">' +
            '<h1 id="agentName">AI Assistant</h1>' +
            '<p id="agentStatus">Online</p>' +
          '</div>' +
          '<div class="chat-header-actions">' +
            '<button class="chat-header-btn" onclick="toggleDark()" aria-label="Toggle dark mode">' +
              '<svg fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<div class="chat-messages" id="messages"></div>' +
        '<div class="voice-indicator" id="voiceIndicator">&#127908; Listening... speak now</div>' +
        '<div class="chat-input-area">' +
          '<textarea class="chat-input" id="chatInput" placeholder="Type or tap mic to speak..." rows="1" onkeydown="handleKey(event)"></textarea>' +
          '<button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" aria-label="Voice input" title="Tap to speak">' +
            '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-14 0M12 19v2m0-18a3 3 0 00-3 3v4a3 3 0 006 0V6a3 3 0 00-3-3z"/></svg>' +
          '</button>' +
          '<button class="chat-send" id="sendBtn" onclick="sendMessage()">Send</button>' +
        '</div>' +
        '<div class="chat-footer">Powered by <a href="https://sphinxagent.ai" target="_blank">Sphinx Agent</a></div>';

      // Add greeting
      addMessage(greeting, 'bot');
      document.getElementById('chatInput').focus();

      // Auto-resize textarea
      var input = document.getElementById('chatInput');
      input.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
    }

    function addMessage(text, role) {
      var msgs = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'msg ' + role;

      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var now = new Date();
      meta.textContent = (role === 'bot' ? 'Agent' : 'You') + ' · ' + now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      // Add listen button for bot messages
      if (role === 'bot' && ttsSupported && text !== 'Thinking...') {
        var ttsBtn = document.createElement('button');
        ttsBtn.className = 'tts-btn';
        ttsBtn.innerHTML = '&#128264; Listen';
        ttsBtn.onclick = function() { speakText(text); };
        meta.appendChild(ttsBtn);
      }
      div.appendChild(meta);

      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    function showTyping() {
      var msgs = document.getElementById('messages');
      var div = document.createElement('div');
      div.className = 'msg bot typing';
      div.id = 'typingIndicator';
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = 'Thinking...';
      div.appendChild(bubble);
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function removeTyping() {
      var el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      var input = document.getElementById('chatInput');
      var btn = document.getElementById('sendBtn');
      var text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      btn.disabled = true;

      addMessage(text, 'user');
      showTyping();

      try {
        var res = await fetch(API + '/widget/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agentId: agentId,
            message: text,
            conversationId: conversationId
          })
        });
        var data = await res.json();
        removeTyping();

        if (res.ok) {
          conversationId = data.conversationId;
          addMessage(data.response, 'bot');
          // Auto-speak response if user used voice input
          if (autoSpeak && ttsSupported) {
            speakText(data.response);
            autoSpeak = false;
          }
          try {
            sessionStorage.setItem('sphinx_chat_' + agentId, JSON.stringify({ conversationId: conversationId }));
          } catch(e) {}

          // Update agent name if we get it
          if (data.agentName) {
            document.getElementById('agentName').textContent = data.agentName;
            document.getElementById('agentAvatar').textContent = data.agentName[0];
          }
        } else {
          addMessage(data.error || 'Something went wrong. Please try again.', 'bot');
        }
      } catch(e) {
        removeTyping();
        addMessage('Connection error. Please check your internet and try again.', 'bot');
      }

      btn.disabled = false;
      input.focus();
    }

    function showError(title, message) {
      var container = document.getElementById('chatContainer');
      container.innerHTML = '' +
        '<div class="error-state">' +
          '<div style="font-size:3rem;">&#129302;</div>' +
          '<h2>' + escapeHtml(title) + '</h2>' +
          '<p>' + escapeHtml(message) + '</p>' +
          '<a href="https://sphinxagent.ai">Go to Sphinx Agent</a>' +
        '</div>';
    }

    function toggleDark() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ===== VOICE INPUT (Speech-to-Text) =====
    var recognition = null;
    var isListening = false;
    var voiceSupported = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;

    function toggleVoice() {
      if (!voiceSupported) {
        addMessage('Voice input is not supported in this browser. Try Chrome or Edge.', 'bot');
        return;
      }
      if (isListening) {
        stopListening();
      } else {
        startListening();
      }
    }

    function startListening() {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = document.documentElement.lang || 'en-US';

      // Try to detect language from conversation
      var msgs = document.getElementById('messages');
      if (msgs && msgs.textContent.match(/[áéíóúñ¿¡]/)) {
        recognition.lang = 'es-ES';
      }

      recognition.onstart = function() {
        isListening = true;
        document.getElementById('voiceBtn').classList.add('listening');
        document.getElementById('voiceIndicator').classList.add('active');
      };

      recognition.onresult = function(event) {
        var transcript = '';
        for (var i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        document.getElementById('chatInput').value = transcript;

        // If final result, auto-send and auto-speak response
        if (event.results[event.results.length - 1].isFinal) {
          stopListening();
          if (transcript.trim()) {
            autoSpeak = true;
            sendMessage();
          }
        }
      };

      recognition.onerror = function(event) {
        stopListening();
        if (event.error !== 'aborted' && event.error !== 'no-speech') {
          addMessage('Voice error: ' + event.error + '. Please try again or type your message.', 'bot');
        }
      };

      recognition.onend = function() {
        stopListening();
      };

      recognition.start();
    }

    function stopListening() {
      isListening = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      var btn = document.getElementById('voiceBtn');
      var indicator = document.getElementById('voiceIndicator');
      if (btn) btn.classList.remove('listening');
      if (indicator) indicator.classList.remove('active');
    }

    // ===== TEXT-TO-SPEECH (Read Aloud) =====
    var ttsSupported = 'speechSynthesis' in window;
    var autoSpeak = false;

    function speakText(text) {
      if (!ttsSupported) return;
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1;
      utterance.pitch = 1;

      // Try to match language
      if (text.match(/[áéíóúñ¿¡]/)) {
        utterance.lang = 'es-ES';
      } else {
        utterance.lang = 'en-US';
      }

      // Try to find a good voice
      var voices = window.speechSynthesis.getVoices();
      var preferred = voices.find(function(v) {
        return v.lang.startsWith(utterance.lang.split('-')[0]) && v.name.includes('Google');
      }) || voices.find(function(v) {
        return v.lang.startsWith(utterance.lang.split('-')[0]);
      });
      if (preferred) utterance.voice = preferred;

      window.speechSynthesis.speak(utterance);
    }

    // Load voices (some browsers need this)
    if (ttsSupported) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
    }

    // Hide voice button if not supported
    if (!voiceSupported) {
      document.addEventListener('DOMContentLoaded', function() {
        var btn = document.getElementById('voiceBtn');
        if (btn) btn.style.display = 'none';
      });
    }
  </script>
</body>
</html>
